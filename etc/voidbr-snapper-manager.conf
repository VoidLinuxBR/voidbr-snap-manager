# /etc/voidbr-snapper-manager.conf

# config do snapper usada para o /
snapper_config="root"

# subvolumes do layout (flat)
root_subvol="@"
snap_subvol="@snapshots"

# se o snapshot pre falhar, abortar a transação do xbps? (yes/no)
abort_on_fail="no"

# pacotes que marcam o snapshot como important=yes
# (usa NUMBER_LIMIT_IMPORTANT do snapper na limpeza)
important_pkgs="linux* glibc xbps voidbr-xbps grub* limine*"

# tamanho máximo da descrição do snapshot
desc_max=120